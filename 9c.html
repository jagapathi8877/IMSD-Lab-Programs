<html>
<body>
  <h1>Register Here</h1>
  <form action="submit">
    <label for="name">Name : </label>
  <input type="text" id="name" minlength="6" pattern="[A-Za-z].*" required>
  <br><br>
  <label for="phn">Mobile : </label>
  <input type="text" id="phn" maxlength="10" pattern="[0-9]{10}" required>
  <br><br>
  <label for="mail">Email : </label>
  <input type="email" id="mail" pattern="*@*.*" required>
  <br><br>
  <button type="submit">Submit</button>
  </form>
</body>
</html>
