<html>
<head>
<script>
    function factorial()
    {
        let a = prompt("Enter a number to find factorial");
        a = Number(a);
        let ans = 1;
        for(let i = 1; i <= a; i++) ans*=i;
        document.write("The factorial of " + a + " is " + ans + "\n");
    }
    function fibbonacci()
    {
        let n = prompt("Enter the number of fibbonacci numbers");
        n = Number(n);
        let a = 1,b = 1;
        if(n == 1) document.write(a + " ");
        if(n > 1) document.write(a + " " + b + " ");
        for(let i = 2; i < n; i++)
        {
            let c = a + b;
            document.write(c + " ");
            a = b;
            b = c;
        }
     }
</script>
</head>
<body>
    <p>Factorial : 
    <input type="button" value="Click Here" onclick="factorial()"></p>
    <p>Fibbonacci : 
    <input type="button" value="Click Here" onclick="fibbonacci()"></p>
</body>
</html>
