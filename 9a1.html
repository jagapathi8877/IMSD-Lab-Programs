<html>
<body>
<script>
     function fact(n){
         let ans = 1;
         for(let i = 1; i <= n; i++) ans*=i;
         document.write("The factorial of " + n + " is " +  ans + "\n"); 
     }
     let a = prompt("Enter a number to find a factorial");
     a = Number(a);
     fact(a);
</script>
</body>
</html>
